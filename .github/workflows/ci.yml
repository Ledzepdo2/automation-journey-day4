name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          docker --version
          docker compose version
          make --version

      - name: Build and run stack
        run: make up

      - name: Run tests
        run: make test

      - name: Cleanup
        if: always()
        run: make down
